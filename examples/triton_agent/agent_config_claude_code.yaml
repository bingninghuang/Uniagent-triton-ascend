- name: triton_claude_code

  _target_: uni_agent.agent_loop.UniAgentLoop

  concurrency: 64
  log_dir: /tmp/triton_claude_code
  mask_abnormal_exit_traj: false

  interaction:
    action_timeout: 300
    max_turns: 100

  env:
    deployment:
      type: local
      image: triton-claude-code-env:latest
      command: >-
        exec python3 -m swerex.server --host 0.0.0.0 --port {port} --auth-token {token}
      timeout: 600
      startup_timeout: 600
      container_runtime: docker
      extra_run_args:
        - --ipc=host
        - --privileged
        - --add-host
        - host.docker.internal:host-gateway
        - -v
        - /dev:/dev
        - -v
        - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        - -v
        - /usr/local/Ascend/firmware:/usr/local/Ascend/firmware:ro
        - -v
        - /usr/local/dcmi:/usr/local/dcmi:ro
        - -v
        - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
        - -v
        - /etc/ascend_install.info:/etc/ascend_install.info:ro
        - -v
        - /tmp/shared_npu_lock:/shared/device-locks
    env_variables:
      PIP_PROGRESS_BAR: "off"
      PIP_CACHE_DIR: "~/.cache/pip"
      PAGER: "cat"
      MANPAGER: "cat"
      LESS: "-R"
      TQDM_DISABLE: "1"
      GIT_PAGER: "cat"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      WORKSPACE_BASE: "/opt/workspace/agent_workdir"
      EVAL_LOCK_DIR: "/shared/device-locks"
      EVAL_DEVICE_PREFIX: "npu"
      EVAL_RETRY_INTERVAL: "1.0"
      EVAL_TIMEOUT: "None"
      EVAL_VERBOSE: "true"
      TRITON_PIPELINE_ERROR_PREVIEW_CHARS: "2000"

  tool_parser: qwen3_coder

  tools:
    - name: str_replace_editor
    - name: execute_bash
    - name: submit

  reward:
    name: triton_kernelbench
    metadata: {}
    eval_timeout: 600

  claude_code:
    time_budget_sec: 1800
